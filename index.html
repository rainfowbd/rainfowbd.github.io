  <!-- ============ DYNAMIC SECTION GENERATOR ============ -->
  <script>
  // Builds one product section per visible top-level category.
  // Runs after catalog.js + products.js have loaded.
  (function () {
    async function build() {
      if (!window.RainFowCatalog) return;

      let cats;
      try {
        cats = await window.RainFowCatalog.getCategories();
      } catch (e) {
        console.error('[dynamic-sections] failed to load categories:', e);
        return;
      }

      const top = (cats.topLevel || []).filter(c => c.productCountAll > 0);
      const wrap = document.getElementById('dynamic-sections');
      if (!wrap || !top.length) return;

      const alt = (i) => i % 2 === 1 ? ' section-alt' : '';

      wrap.innerHTML = top.map((c, i) => `
        <section class="section${alt(i)}">
          <div class="container">
            <header class="section-head">
              <h2>${c.name}</h2>
              <p>Browse ${c.productCountAll} item${c.productCountAll === 1 ? '' : 's'}</p>
            </header>
            <div class="product-grid"
                 data-products
                 data-filter="category:${c.slug}"
                 data-limit="8"></div>
          </div>
        </section>
      `).join('');

      // Now tell products.js to render the empty containers we just added
      if (typeof window.__rfRenderDynamic === 'function') {
        await window.__rfRenderDynamic();
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', build);
    } else {
      build();
    }
  })();
  </script>
