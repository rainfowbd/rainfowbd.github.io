<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>429 — Too Many Requests | RainFow Bangladesh</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="error-page">
  <div class="error-card">

    <!-- GRAPHIC: Hourglass -->
    <svg class="error-graphic" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="100" cy="100" r="90" fill="#f0ebff"/>
      <path d="M75 55h50v20l-15 25 15 25v20H75v-20l15-25-15-25V55z"
            stroke="#6c5ce7" stroke-width="4" stroke-linejoin="round" fill="#fff"/>
      <path d="M88 100l12-15 12 15-12 15-12-15z" fill="#a29bfe"/>
      <circle cx="100" cy="100" r="90" stroke="#e0dcff" stroke-width="2" fill="none"/>
    </svg>

    <h1 class="error-code">429</h1>
    <h2 class="error-title">Slow Down a Little</h2>
    <p class="error-message">
      You've made too many requests in a short time. Please wait a moment
      before trying again — this helps us keep the site fast for everyone.
    </p>

    <div class="error-actions">
      <a href="index.html" class="error-btn error-btn-primary">Back to Home</a>
      <a href="products.html" class="error-btn error-btn-ghost">Browse Products</a>
    </div>

    <p class="error-help">
      Getting this often? <a href="contact.html">Let us know</a>.
    </p>

  </div>
</div>
<script>
  if (typeof gtag === 'function') {
    gtag('event', 'page_view', {
      page_title: 'Error: 429',
      page_location: location.href
    });
  }
</script>
</body>
</html>
