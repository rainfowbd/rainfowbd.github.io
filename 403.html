<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>403 — Access Denied | RainFow Bangladesh</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="error-page">
  <div class="error-card">

    <!-- GRAPHIC: Lock -->
    <svg class="error-graphic" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="100" cy="100" r="90" fill="#fff8e6"/>
      <rect x="65" y="90" width="70" height="55" rx="8"
            stroke="#f39c12" stroke-width="4" fill="#fff"/>
      <path d="M80 90V72a20 20 0 0140 0v18"
            stroke="#f39c12" stroke-width="4" stroke-linecap="round" fill="none"/>
      <circle cx="100" cy="115" r="6" fill="#f39c12"/>
      <rect x="97" y="118" width="6" height="14" rx="3" fill="#f39c12"/>
      <circle cx="100" cy="100" r="90" stroke="#ffeeba" stroke-width="2" fill="none"/>
    </svg>

    <h1 class="error-code" style="background:linear-gradient(135deg,#f39c12,#fdcb6e);-webkit-background-clip:text;background-clip:text;">403</h1>
    <h2 class="error-title">Access Denied</h2>
    <p class="error-message">
      You don't have permission to view this page. If you believe this is a
      mistake, please make sure you're logged in with the correct account.
    </p>

    <div class="error-actions">
      <a href="index.html" class="error-btn error-btn-primary">Back to Home</a>
      <a href="contact.html" class="error-btn error-btn-ghost">Request Access</a>
    </div>

    <p class="error-help">
      Need help? <a href="contact.html">Contact support</a>.
    </p>

  </div>
</div>
<script>
  if (typeof gtag === 'function') {
    gtag('event', 'page_view', {
      page_title: 'Error: 403',
      page_location: location.href
    });
  }
</script>
</body>
</html>
